# SEOの自動チェック。ルールは AGENTS.md の「SEO」、中身は tools/seo_check.py。
# PR ごとに走り、NG があると PR に赤い×が付く（マージ前に気づける）。
# 週1回（月曜 9:00 JST）は自治体の公式ページへのリンクが開けるかも確かめる。
name: SEO check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: SEO check
        run: python3 tools/seo_check.py . ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--external' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
