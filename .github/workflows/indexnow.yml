name: IndexNow
# main に入った変更ページを Bing など（IndexNow 対応の検索エンジン）にすぐ知らせる。
# 鍵はルートの fa510d9b5bbeba496f491544065f4f5a.txt（IndexNow の仕組み上、公開してよい値）。
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:
    inputs:
      all:
        description: 'sitemap.xml の全URLを送る'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Send changed URLs
        env:
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          python3 tools/indexnow.py "$BEFORE" "$ALL"
